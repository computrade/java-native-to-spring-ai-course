server:
  port: 6061

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: mappings
app:
  finnhub:
    api-key: ${FINNHUB_API_KEY}

spring:
  application:
    name: section-9-mcp-server-http
  ai:
    mcp:
      server:
        name: stock-market-mcp-server-http
        version: 1.0.0
        type: SYNC
        instructions: "This server provides STOCK information tools and resources"
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        sse-message-endpoint: /mcp/messages
        keep-alive-interval: 30s


